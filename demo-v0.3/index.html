<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرکز کنترل آموزشگاه روشنفکران v0.3</title><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e7eaf0;--nav:#111827;--ok:#067647;--warn:#b54708;--bad:#b42318;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.app{min-height:100vh}.top{background:var(--nav);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10}.brand h1{font-size:20px;margin:0}.brand small{opacity:.75}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:#1f2937;border:1px solid #374151;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer}.nav button.active{background:#fff;color:#111827}.wrap{max-width:1380px;margin:auto;padding:20px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #1018280a}.card{padding:18px}.card .k{font-size:12px;color:var(--muted)}.card b{display:block;font-size:23px;margin-top:8px}.panel{padding:16px;margin-top:16px}.panel h3{margin:0 0 14px}.toolbar,.formgrid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.formgrid label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}textarea{min-height:78px}.btn{border:0;padding:10px 14px;border-radius:10px;cursor:pointer;background:#111827;color:#fff}.btn.alt{background:#eef2ff;color:#27346b}.btn.good{background:#067647}.btn.bad{background:#b42318}.btn.light{background:#fff;color:#111827;border:1px solid #d0d5dd}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:600}.click{cursor:pointer;font-weight:700}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:var(--soft)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.show{display:flex}.box{background:#fff;border-radius:18px;width:min(980px,96vw);max-height:90vh;overflow:auto;padding:18px}.box.sm{width:min(620px,96vw)}.boxhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.boxhead h2{font-size:18px;margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:9px;cursor:pointer}.tabs button.active{background:#111827;color:#fff}.tabbody{display:none}.tabbody.active{display:block}.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.mini .m{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}.mini .m b{display:block;margin-top:6px}.receipt{border:2px dashed #98a2b3;padding:18px;border-radius:14px}.bar{height:9px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#344054}.notice{background:#fffaeb;border:1px solid #fedf89;padding:10px 12px;border-radius:10px;font-size:12px}.rightactions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:26px;text-align:center;color:var(--muted)}@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.split{grid-template-columns:1fr}.wrap{padding:12px}.nav{overflow:auto;flex-wrap:nowrap;width:100%}.nav button{white-space:nowrap}}@media print{body *{visibility:hidden}.receipt,.receipt *{visibility:visible}.receipt{position:absolute;inset:10px;border:1px solid #000}}</style></head><body><div class="app"><header class="top"><div class="brand"><h1>مرکز کنترل آموزشگاه روشنفکران</h1><small>نسخه نمایشی یکپارچه v0.3 — فقط داده آزمایشی</small></div><nav class="nav" id="nav"></nav></header><main class="wrap"><section id="dashboard" class="page active"></section><section id="students" class="page"></section><section id="registrations" class="page"></section><section id="payments" class="page"></section><section id="installments" class="page"></section><section id="courses" class="page"></section><section id="reports" class="page"></section></main></div><div class="modal" id="modal"><div class="box" id="modalbox"></div></div><script>const P='rf_academy_v03';const fmt=n=>new Intl.NumberFormat('fa-IR').format(Math.round(Number(n)||0));const money=n=>fmt(n)+' تومان';const now=()=>new Date().toISOString().slice(0,10);const id=p=>p+'-'+Math.random().toString(36).slice(2,9);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));function seed(){const courses=[['c1','هوش مصنوعی','اشوان صدری',15000000],['c2','فارکس','مدرس بازارهای مالی',18000000],['c3','ارز دیجیتال','مدرس بازارهای مالی',14000000],['c4','امور مالی و بازرگانی','مربی امور مالی',12000000],['c5','مهارت‌های فنی','مربی فنی',10000000]].map(x=>({id:x[0],name:x[1],teacher:x[2],fee:x[3],status:'فعال'}));const names=['علی رضایی','سارا احمدی','مریم محمدی','محمد حسینی','زهرا کریمی','رضا اکبری','فاطمه مرادی','امیر نادری','نگار قاسمی','حسین شریفی','الهام یوسفی','مجتبی رحیمی','ریحانه صادقی','آرمان عزیزی','نازنین جعفری','یاسین رستمی','سمانه محمودی','پوریا کاظمی','مینا حیدری','میلاد امیری'];const students=names.map((n,i)=>({id:'s'+(i+1),name:n,mobile:'09'+String(100000000+i).padStart(9,'0'),city:i%3?'اقلید':'شیراز',status:i%7===0?'پایان دوره':'فعال',created:'2026-09-'+String((i%9)+1).padStart(2,'0'),notes:''}));const enrollments=[];const payments=[];const installments=[];students.forEach((s,i)=>{const c=courses[i%courses.length];const fee=c.fee;const discount=i%6===0?1000000:0;const final=fee-discount;const paid=i%5===1?final:i%5===2?Math.floor(final*.5):i%5===3?Math.floor(final*.7):i%5===4?Math.floor(final*.3):Math.floor(final*.8);const e={id:'e'+(i+1),studentId:s.id,courseId:c.id,fee,discount,final,status:paid>=final?'تسویه':'فعال',created:s.created};enrollments.push(e);if(paid>0)payments.push({id:'p'+(i+1),studentId:s.id,enrollmentId:e.id,amount:paid,method:i%2?'کارتخوان':'کارت به کارت',date:s.created,receipt:'RF-'+String(i+1).padStart(5,'0'),note:'پرداخت آزمایشی'});const rem=final-paid;if(rem>0){const parts=3;for(let k=1;k<=parts;k++){const amount=k===parts?rem-Math.floor(rem/parts)*(parts-1):Math.floor(rem/parts);installments.push({id:id('i'),studentId:s.id,enrollmentId:e.id,amount,due:'2026-'+String(9+Math.floor((k-1)/2)).padStart(2,'0')+'-'+String(10+k*5).padStart(2,'0'),status:k===1&&i%4===0?'عقب‌افتاده':'باز'});}}});return{courses,students,enrollments,payments,installments,audit:[{id:id('a'),text:'داده دمو ایجاد شد',date:now()}]}}let db=JSON.parse(localStorage.getItem(P)||'null')||seed();function save(note){if(note)db.audit.unshift({id:id('a'),text:note,date:now()});localStorage.setItem(P,JSON.stringify(db));renderAll()}const pages=[['dashboard','داشبورد'],['students','هنرجوها'],['registrations','ثبت‌نام'],['payments','پرداخت‌ها'],['installments','اقساط'],['courses','دوره‌ها'],['reports','گزارش‌ها']];document.getElementById('nav').innerHTML=pages.map((p,i)=>`<button class="${i?'':'active'}" data-page="${p[0]}">${p[1]}</button>`).join('');document.getElementById('nav').onclick=e=>{if(!e.target.dataset.page)return;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(e.target.dataset.page).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));e.target.classList.add('active')};function enrollmentOf(sid){return db.enrollments.find(x=>x.studentId===sid)}function paidOf(eid){return db.payments.filter(x=>x.enrollmentId===eid).reduce((a,b)=>a+b.amount,0)}function balanceOf(e){return Math.max(0,e.final-paidOf(e.id))}function courseOf(id){return db.courses.find(x=>x.id===id)}function studentOf(id){return db.students.find(x=>x.id===id)}function dashboard(){const totalPaid=db.payments.reduce((a,b)=>a+b.amount,0);const totalFinal=db.enrollments.reduce((a,b)=>a+b.final,0);const debt=Math.max(0,totalFinal-totalPaid);const overdue=db.installments.filter(x=>x.status==='عقب‌افتاده').length;const debtors=db.enrollments.filter(e=>balanceOf(e)>0).sort((a,b)=>balanceOf(b)-balanceOf(a)).slice(0,6);document.getElementById('dashboard').innerHTML=`<div class="cards"><div class="card"><span class="k">کل هنرجو</span><b>${fmt(db.students.length)}</b></div><div class="card"><span class="k">درآمد وصول‌شده</span><b>${money(totalPaid)}</b></div><div class="card"><span class="k">مطالبات</span><b class="bad">${money(debt)}</b></div><div class="card"><span class="k">اقساط عقب‌افتاده</span><b class="warn">${fmt(overdue)}</b></div><div class="card"><span class="k">دوره فعال</span><b>${fmt(db.courses.filter(c=>c.status==='فعال').length)}</b></div></div><div class="split"><div class="panel"><h3>بدهکاران مهم</h3><div class="list">${debtors.map(e=>`<div class="item"><div><b>${esc(studentOf(e.studentId).name)}</b><div class="muted">${esc(courseOf(e.courseId).name)}</div></div><div><b class="bad">${money(balanceOf(e))}</b><button class="btn alt" onclick="openStudent('${e.studentId}')">پرونده</button></div></div>`).join('')||'<div class="empty">موردی نیست</div>'}</div></div><div class="panel"><h3>آخرین عملیات</h3><div class="list">${db.audit.slice(0,8).map(a=>`<div class="item"><span>${esc(a.text)}</span><span class="muted">${a.date}</span></div>`).join('')}</div></div></div>`}function studentsPage(){document.getElementById('students').innerHTML=`<div class="panel"><div class="toolbar"><input id="studentQ" placeholder="جستجوی نام یا موبایل" style="max-width:280px"><select id="studentFilter" style="max-width:180px"><option value="">همه وضعیت‌ها</option><option>فعال</option><option>پایان دوره</option></select><button class="btn" onclick="studentForm()">+ هنرجوی جدید</button></div><div class="tablewrap"><table><thead><tr><th>هنرجو</th><th>موبایل</th><th>دوره</th><th>وضعیت</th><th>شهریه نهایی</th><th>پرداخت</th><th>مانده</th></tr></thead><tbody id="studentRows"></tbody></table></div></div>`;const draw=()=>{const q=document.getElementById('studentQ').value.trim(),f=document.getElementById('studentFilter').value;document.getElementById('studentRows').innerHTML=db.students.filter(s=>(!q||s.name.includes(q)||s.mobile.includes(q))&&(!f||s.status===f)).map(s=>{const e=enrollmentOf(s.id),c=e&&courseOf(e.courseId),p=e?paidOf(e.id):0,b=e?balanceOf(e):0;return `<tr><td class="click" onclick="openStudent('${s.id}')">${esc(s.name)}</td><td>${esc(s.mobile)}</td><td>${c?esc(c.name):'-'}</td><td><span class="badge">${esc(s.status)}</span></td><td>${e?money(e.final):'-'}</td><td>${e?money(p):'-'}</td><td class="${b?'bad':'ok'}">${e?money(b):'-'}</td></tr>`}).join('')};document.getElementById('studentQ').oninput=draw;document.getElementById('studentFilter').onchange=draw;draw()}function registrationsPage(){document.getElementById('registrations').innerHTML=`<div class="panel"><h3>ثبت‌نام جدید</h3><div class="notice">برای دمو، هر هنرجو یک ثبت‌نام فعال دارد. برای ثبت‌نام جدید می‌توانی هنرجوی تازه بسازی یا از پرونده هنرجو استفاده کنی.</div><div style="margin-top:12px"><button class="btn" onclick="studentForm(true)">شروع ثبت‌نام جدید</button></div></div><div class="panel"><h3>ثبت‌نام‌های فعلی</h3><div class="tablewrap"><table><thead><tr><th>هنرجو</th><th>دوره</th><th>شهریه</th><th>تخفیف</th><th>نهایی</th><th>مانده</th></tr></thead><tbody>${db.enrollments.map(e=>`<tr><td class="click" onclick="openStudent('${e.studentId}')">${esc(studentOf(e.studentId).name)}</td><td>${esc(courseOf(e.courseId).name)}</td><td>${money(e.fee)}</td><td>${money(e.discount)}</td><td>${money(e.final)}</td><td class="${balanceOf(e)?'bad':'ok'}">${money(balanceOf(e))}</td></tr>`).join('')}</tbody></table></div></div>`}function paymentsPage(){document.getElementById('payments').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn good" onclick="paymentForm()">+ ثبت پرداخت</button><button class="btn light" onclick="exportCSV('payments')">خروجی CSV</button></div><div class="tablewrap"><table><thead><tr><th>رسید</th><th>هنرجو</th><th>دوره</th><th>مبلغ</th><th>روش</th><th>تاریخ</th><th></th></tr></thead><tbody>${[...db.payments].reverse().map(p=>{const e=db.enrollments.find(x=>x.id===p.enrollmentId);return `<tr><td>${p.receipt}</td><td>${esc(studentOf(p.studentId).name)}</td><td>${esc(courseOf(e.courseId).name)}</td><td>${money(p.amount)}</td><td>${esc(p.method)}</td><td>${p.date}</td><td><button class="btn alt" onclick="receipt('${p.id}')">رسید</button></td></tr>`}).join('')}</tbody></table></div></div>`}function installmentsPage(){const rows=[...db.installments].sort((a,b)=>a.due.localeCompare(b.due));document.getElementById('installments').innerHTML=`<div class="panel"><div class="toolbar"><select id="instFilter" style="max-width:200px"><option value="">همه اقساط</option><option>باز</option><option>عقب‌افتاده</option><option>پرداخت‌شده</option></select><button class="btn light" onclick="exportCSV('installments')">خروجی CSV</button></div><div class="tablewrap"><table><thead><tr><th>هنرجو</th><th>مبلغ</th><th>سررسید</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="instRows"></tbody></table></div></div>`;const draw=()=>{const f=document.getElementById('instFilter').value;document.getElementById('instRows').innerHTML=rows.filter(x=>!f||x.status===f).map(i=>`<tr><td class="click" onclick="openStudent('${i.studentId}')">${esc(studentOf(i.studentId).name)}</td><td>${money(i.amount)}</td><td>${i.due}</td><td><span class="badge ${i.status==='عقب‌افتاده'?'bad':''}">${i.status}</span></td><td>${i.status!=='پرداخت‌شده'?`<button class="btn alt" onclick="paymentForm('${i.studentId}','${i.id}')">پرداخت</button>`:'-'}</td></tr>`).join('')};document.getElementById('instFilter').onchange=draw;draw()}function coursesPage(){document.getElementById('courses').innerHTML=`<div class="panel"><div class="toolbar"><button class="btn" onclick="courseForm()">+ دوره جدید</button></div><div class="tablewrap"><table><thead><tr><th>نام دوره</th><th>مدرس</th><th>شهریه پایه</th><th>وضعیت</th><th>تعداد هنرجو</th></tr></thead><tbody>${db.courses.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.teacher)}</td><td>${money(c.fee)}</td><td><span class="badge">${c.status}</span></td><td>${fmt(db.enrollments.filter(e=>e.courseId===c.id).length)}</td></tr>`).join('')}</tbody></table></div></div>`}function reportsPage(){const total=db.enrollments.reduce((a,e)=>a+e.final,0),paid=db.payments.reduce((a,p)=>a+p.amount,0),debt=total-paid;const byCourse=db.courses.map(c=>{const es=db.enrollments.filter(e=>e.courseId===c.id);return{c,students:es.length,final:es.reduce((a,e)=>a+e.final,0),paid:es.reduce((a,e)=>a+paidOf(e.id),0)}});document.getElementById('reports').innerHTML=`<div class="cards"><div class="card"><span class="k">فروش دوره‌ها</span><b>${money(total)}</b></div><div class="card"><span class="k">وصولی</span><b>${money(paid)}</b></div><div class="card"><span class="k">مانده مطالبات</span><b class="bad">${money(debt)}</b></div><div class="card"><span class="k">نرخ وصول</span><b>${total?fmt(paid/total*100):0}٪</b></div></div><div class="panel"><div class="toolbar"><button class="btn light" onclick="exportCSV('students')">CSV هنرجوها</button><button class="btn light" onclick="backup()">پشتیبان JSON</button><button class="btn bad" onclick="resetDemo()">بازنشانی دمو</button></div><h3>گزارش دوره‌ها</h3><div class="tablewrap"><table><thead><tr><th>دوره</th><th>هنرجو</th><th>شهریه نهایی</th><th>وصولی</th><th>مطالبات</th><th>درصد وصول</th></tr></thead><tbody>${byCourse.map(x=>`<tr><td>${esc(x.c.name)}</td><td>${fmt(x.students)}</td><td>${money(x.final)}</td><td>${money(x.paid)}</td><td>${money(x.final-x.paid)}</td><td>${x.final?fmt(x.paid/x.final*100):0}٪</td></tr>`).join('')}</tbody></table></div></div>`}function studentForm(withEnrollment=false){const opts=db.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');show(`<div class="boxhead"><h2>${withEnrollment?'ثبت‌نام جدید':'هنرجوی جدید'}</h2><button class="btn light" onclick="closeM()">بستن</button></div><div class="formgrid"><div><label>نام و نام خانوادگی</label><input id="sf_name"></div><div><label>موبایل</label><input id="sf_mobile"></div><div><label>شهر</label><input id="sf_city" value="اقلید"></div>${withEnrollment?`<div><label>دوره</label><select id="sf_course">${opts}</select></div><div><label>تخفیف</label><input id="sf_discount" type="number" value="0"></div><div><label>پیش‌پرداخت</label><input id="sf_paid" type="number" value="0"></div>`:''}</div><div style="margin-top:14px"><button class="btn good" onclick="saveStudent(${withEnrollment})">ذخیره</button></div>`,true)}function saveStudent(withEnrollment){const name=document.getElementById('sf_name').value.trim(),mobile=document.getElementById('sf_mobile').value.trim(),city=document.getElementById('sf_city').value.trim();if(!name||!mobile)return alert('نام و موبایل لازم است');const s={id:id('s'),name,mobile,city,status:'فعال',created:now(),notes:''};db.students.push(s);if(withEnrollment){const cid=document.getElementById('sf_course').value,c=courseOf(cid),discount=Number(document.getElementById('sf_discount').value||0),pre=Number(document.getElementById('sf_paid').value||0),final=Math.max(0,c.fee-discount),e={id:id('e'),studentId:s.id,courseId:cid,fee:c.fee,discount,final,status:pre>=final?'تسویه':'فعال',created:now()};db.enrollments.push(e);if(pre>0)db.payments.push({id:id('p'),studentId:s.id,enrollmentId:e.id,amount:Math.min(pre,final),method:'کارتخوان',date:now(),receipt:'RF-'+String(db.payments.length+1).padStart(5,'0'),note:'پیش‌پرداخت'});const rem=balanceOf(e);if(rem>0){for(let k=1;k<=3;k++)db.installments.push({id:id('i'),studentId:s.id,enrollmentId:e.id,amount:k===3?rem-Math.floor(rem/3)*2:Math.floor(rem/3),due:'2026-'+String(10+k).padStart(2,'0')+'-10',status:'باز'})}}save('هنرجو '+name+' ثبت شد');closeM()}function courseForm(){show(`<div class="boxhead"><h2>دوره جدید</h2><button class="btn light" onclick="closeM()">بستن</button></div><div class="formgrid"><div><label>نام دوره</label><input id="cf_name"></div><div><label>مدرس</label><input id="cf_teacher"></div><div><label>شهریه پایه</label><input id="cf_fee" type="number"></div></div><div style="margin-top:14px"><button class="btn good" onclick="saveCourse()">ذخیره</button></div>`,true)}function saveCourse(){const name=document.getElementById('cf_name').value.trim(),teacher=document.getElementById('cf_teacher').value.trim(),fee=Number(document.getElementById('cf_fee').value||0);if(!name||fee<=0)return alert('نام دوره و شهریه معتبر لازم است');db.courses.push({id:id('c'),name,teacher:teacher||'-',fee,status:'فعال'});save('دوره '+name+' ایجاد شد');closeM()}function paymentForm(sid='',iid=''){const candidates=db.enrollments.filter(e=>balanceOf(e)>0&&(sid?e.studentId===sid:true));if(!candidates.length)return alert('مانده‌ای برای پرداخت وجود ندارد');show(`<div class="boxhead"><h2>ثبت پرداخت</h2><button class="btn light" onclick="closeM()">بستن</button></div><div class="formgrid"><div><label>هنرجو / دوره</label><select id="pf_enr">${candidates.map(e=>`<option value="${e.id}">${esc(studentOf(e.studentId).name)} — ${esc(courseOf(e.courseId).name)} — مانده ${money(balanceOf(e))}</option>`).join('')}</select></div><div><label>مبلغ</label><input id="pf_amount" type="number"></div><div><label>روش پرداخت</label><select id="pf_method"><option>کارتخوان</option><option>کارت به کارت</option><option>نقدی</option><option>واریز بانکی</option></select></div><div><label>تاریخ</label><input id="pf_date" type="date" value="${now()}"></div><div style="grid-column:1/-1"><label>توضیح</label><input id="pf_note" placeholder="اختیاری"></div></div><div style="margin-top:14px"><button class="btn good" onclick="savePayment('${iid}')">ثبت و صدور رسید</button></div>`,true)}function savePayment(iid){const eid=document.getElementById('pf_enr').value,e=db.enrollments.find(x=>x.id===eid),amount=Number(document.getElementById('pf_amount').value||0),bal=balanceOf(e);if(amount<=0)return alert('مبلغ معتبر وارد کن');if(amount>bal)return alert('مبلغ از مانده بدهی بیشتر است');const p={id:id('p'),studentId:e.studentId,enrollmentId:e.id,amount,method:document.getElementById('pf_method').value,date:document.getElementById('pf_date').value||now(),receipt:'RF-'+String(db.payments.length+1).padStart(5,'0'),note:document.getElementById('pf_note').value.trim()};db.payments.push(p);let remaining=amount;const insts=db.installments.filter(i=>i.enrollmentId===e.id&&i.status!=='پرداخت‌شده').sort((a,b)=>a.due.localeCompare(b.due));for(const i of insts){if(remaining>=i.amount){i.status='پرداخت‌شده';remaining-=i.amount}else break}if(balanceOf(e)===0)e.status='تسویه';save('پرداخت '+money(amount)+' برای '+studentOf(e.studentId).name+' ثبت شد');closeM();receipt(p.id)}function openStudent(sid){const s=studentOf(sid),e=enrollmentOf(sid),c=e&&courseOf(e.courseId),p=e?paidOf(e.id):0,b=e?balanceOf(e):0,ps=db.payments.filter(x=>x.studentId===sid).reverse(),ins=db.installments.filter(x=>x.studentId===sid).sort((a,b)=>a.due.localeCompare(b.due));show(`<div class="boxhead"><div><h2>${esc(s.name)}</h2><div class="muted">${esc(s.mobile)} — ${esc(s.city)} — وضعیت ${esc(s.status)}</div></div><div class="rightactions"><button class="btn good" onclick="closeM();paymentForm('${sid}')">ثبت پرداخت</button><button class="btn light" onclick="closeM()">بستن</button></div></div>${e?`<div class="mini"><div class="m">دوره<b>${esc(c.name)}</b></div><div class="m">شهریه پایه<b>${money(e.fee)}</b></div><div class="m">تخفیف<b>${money(e.discount)}</b></div><div class="m">پرداخت<b class="ok">${money(p)}</b></div><div class="m">مانده<b class="${b?'bad':'ok'}">${money(b)}</b></div></div><div class="panel"><h3>پیشرفت مالی</h3><div class="bar"><span style="width:${e.final?Math.min(100,p/e.final*100):100}%"></span></div><div class="muted" style="margin-top:6px">${e.final?fmt(p/e.final*100):100}٪ وصول شده</div></div>`:'<div class="notice">برای این هنرجو ثبت‌نامی وجود ندارد.</div>'}<div class="split"><div class="panel"><h3>پرداخت‌ها</h3>${ps.length?ps.map(x=>`<div class="item"><div><b>${money(x.amount)}</b><div class="muted">${x.date} — ${esc(x.method)}</div></div><button class="btn alt" onclick="receipt('${x.id}')">${x.receipt}</button></div>`).join(''):'<div class="empty">پرداختی نیست</div>'}</div><div class="panel"><h3>اقساط</h3>${ins.length?ins.map(i=>`<div class="item"><div><b>${money(i.amount)}</b><div class="muted">سررسید ${i.due}</div></div><span class="badge ${i.status==='عقب‌افتاده'?'bad':''}">${i.status}</span></div>`).join(''):'<div class="empty">قسطی نیست</div>'}</div></div>`,false)}function receipt(pid){const p=db.payments.find(x=>x.id===pid),s=studentOf(p.studentId),e=db.enrollments.find(x=>x.id===p.enrollmentId),c=courseOf(e.courseId);show(`<div class="boxhead"><h2>رسید پرداخت</h2><div class="rightactions"><button class="btn" onclick="window.print()">چاپ</button><button class="btn light" onclick="closeM()">بستن</button></div></div><div class="receipt"><h2>آموزشگاه آزاد فنی‌وحرفه‌ای روشنفکران</h2><p>شماره رسید: <b>${p.receipt}</b></p><p>هنرجو: <b>${esc(s.name)}</b></p><p>دوره: <b>${esc(c.name)}</b></p><p>مبلغ: <b>${money(p.amount)}</b></p><p>روش پرداخت: ${esc(p.method)}</p><p>تاریخ: ${p.date}</p><p>مانده پس از این پرداخت: <b>${money(balanceOf(e))}</b></p>${p.note?`<p>توضیح: ${esc(p.note)}</p>`:''}</div>`,false)}function exportCSV(kind){let rows=[];if(kind==='students')rows=[['نام','موبایل','شهر','وضعیت'],...db.students.map(s=>[s.name,s.mobile,s.city,s.status])];if(kind==='payments')rows=[['رسید','هنرجو','مبلغ','روش','تاریخ'],...db.payments.map(p=>[p.receipt,studentOf(p.studentId).name,p.amount,p.method,p.date])];if(kind==='installments')rows=[['هنرجو','مبلغ','سررسید','وضعیت'],...db.installments.map(i=>[studentOf(i.studentId).name,i.amount,i.due,i.status])];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');dl(kind+'.csv',csv,'text/csv;charset=utf-8')}function backup(){dl('roshanfekran-demo-backup.json',JSON.stringify(db,null,2),'application/json')}function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetDemo(){if(confirm('تمام تغییرات آزمایشی پاک و داده دمو بازنشانی شود؟')){db=seed();save('دمو بازنشانی شد')}}function show(html,small){const m=document.getElementById('modal');document.getElementById('modalbox').className='box'+(small?' sm':'');document.getElementById('modalbox').innerHTML=html;m.classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};function renderAll(){dashboard();studentsPage();registrationsPage();paymentsPage();installmentsPage();coursesPage();reportsPage()}renderAll();</script></body></html>
