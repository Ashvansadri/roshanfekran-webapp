<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرکز کنترل آموزشگاه روشنفکران</title><link rel="stylesheet" href="/styles.css"></head><body><header><div><h1>مرکز کنترل آموزشگاه روشنفکران</h1><p>ثبت‌نام، شهریه، اقساط و پرداخت‌ها</p></div><button id="refresh">بروزرسانی</button></header><main><section class="cards" id="cards"></section><section class="panel"><div class="panel-head"><h2>هنرجویان</h2><div class="filters"><input id="search" placeholder="جستجو نام یا موبایل"><select id="status"><option value="">همه وضعیت‌ها</option><option value="lead">متقاضی</option><option value="consulted">مشاوره شده</option><option value="pre_registered">پیش‌ثبت‌نام</option><option value="active">فعال</option><option value="completed">پایان دوره</option><option value="withdrawn">انصراف</option></select><button id="newStudent">+ هنرجوی جدید</button></div></div><div class="table-wrap"><table><thead><tr><th>نام</th><th>موبایل</th><th>وضعیت</th><th>شهریه</th><th>پرداخت</th><th>مانده</th></tr></thead><tbody id="students"></tbody></table></div></section><section class="grid"><section class="panel"><h2>اقساط و سررسیدها</h2><div id="installments"></div></section><section class="panel"><h2>افزودن دوره</h2><form id="courseForm"><input name="title" placeholder="عنوان دوره" required><input name="code" placeholder="کد دوره"><input name="default_fee" type="number" min="0" placeholder="شهریه پیش‌فرض (تومان)"><button>ثبت دوره</button></form><h3>دوره‌های فعال</h3><div id="courses"></div></section></section></main><dialog id="studentDialog"><form method="dialog" id="studentForm"><h2>هنرجوی جدید</h2><input name="full_name" placeholder="نام و نام خانوادگی" required><input name="mobile" placeholder="شماره موبایل" required><input name="national_id" placeholder="کد ملی"><input name="city" placeholder="شهر"><textarea name="notes" placeholder="توضیحات"></textarea><div class="actions"><button value="cancel" class="secondary">انصراف</button><button value="default" id="saveStudent">ثبت هنرجو</button></div></form></dialog><div id="toast"></div><script src="/app.js"></script></body></html>
