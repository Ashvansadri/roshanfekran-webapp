name: Validate Roshanfekran staging
on:
  push:
    branches: [roshanfekran-next-20261021]
  pull_request:
    branches: [main]
jobs:
  source-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend source, privacy and public assets
        run: node scripts/verify.mjs
      - name: Export standalone cinematic HTML
        uses: actions/upload-artifact@v4
        with:
          name: roshanfekran-cinematic-index
          path: site/index.html
          retention-days: 14
      - name: Verify PWA push safety and notification navigation
        run: node scripts/pwa-push.test.mjs
      - name: Verify Push subscription ownership and opt-in readiness
        run: node scripts/push-subscription-security.test.mjs
      - name: Recheck live student and guardian Push permissions before dispatch
        run: node scripts/push-recipient-consent.test.mjs
      - name: Guard scheduled daily learning release and Push delivery eligibility
        run: node scripts/daily-content-release.test.mjs
      - name: Check assignment submission privilege hardening
        run: node scripts/submission-write-grants.test.mjs
      - name: Verify archived-teacher and staff authorization guards
        run: node scripts/archived-teacher-guards.test.mjs
      - name: Check API DDL privilege hardening migration
        run: node scripts/api-ddl-privileges.test.mjs
      - name: Verify canonical gateway routes and traversal denial
        run: node scripts/proxy-path-guard.test.mjs
      - name: Verify private receipt paths and legacy assignment RPC enforcement
        run: node scripts/gateway-private-files.test.mjs
      - name: Check verified guardian SMS OTP security gates
        run: node scripts/guardian-phone-gateway.test.mjs
      - name: Parse serverless gateway TypeScript syntax
        run: npx --yes esbuild@0.25.12 supabase/functions/academy-gateway/index.ts --outfile=/tmp/academy-gateway-syntax.js
      - name: Run offline operations, finance and role-isolation regressions
        run: |
          set -e
          for test_file in \
            scripts/ops-course.test.mjs \
            scripts/ops-class.test.mjs \
            scripts/ops-teacher.test.mjs \
            scripts/ops-isolation.test.mjs \
            scripts/ops-write-confirmation.test.mjs \
            scripts/ops-attendance.test.mjs \
            scripts/ops-attendance-export.test.mjs \
            scripts/ops-finance.test.mjs \
            scripts/ops-contracts.test.mjs \
            scripts/ops-contract-draft.test.mjs \
            scripts/ops-risk.test.mjs \
            scripts/ops-student-services.test.mjs \
            scripts/ops-service-reply.test.mjs \
            scripts/ops-documents.test.mjs \
            scripts/document-review-migration.test.mjs \
            scripts/service-request-audit-migration.test.mjs \
            scripts/service-request-create-guards.test.mjs \
            scripts/enrollment-financial-integrity.test.mjs \
            scripts/payment-amount-integrity.test.mjs \
            scripts/gateway-archive.test.mjs; do
            echo "Checking ${test_file}"
            node "${test_file}"
          done
      - name: Read-only smoke test against live Supabase public gateway
        run: node scripts/api-smoke.mjs
      - name: Verify live gateway blocks direct contract writes (forged token only)
        run: node scripts/gateway-contract-write-live.test.mjs
      - name: Safe live guardian onboarding status (never sends SMS)
        run: node scripts/guardian-live-safe-smoke.mjs
  browser-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch static app locally
        run: |
          python3 scripts/qa_server.py > /tmp/roshanfekran-test-server.log 2>&1 &
          sleep 2
      - name: Mobile, desktop and security UX smoke
        run: npx playwright test --reporter=line
      - name: Save screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roshanfekran-browser-qa
          path: test-results/
          retention-days: 7

  video-probe:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - name: Verify exact external video GET and identify codec
        shell: bash
        run: |
          set -euo pipefail
          URL="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4"
          mkdir -p /tmp/rf-video
          curl --fail --location --show-error --silent --retry 1 --max-time 50 --user-agent 'Mozilla/5.0' "$URL" -o /tmp/rf-video/reference.mp4
          ls -lh /tmp/rf-video/reference.mp4
          ffprobe -hide_banner -v error -select_streams v:0 -show_entries stream=codec_name,profile,width,height,pix_fmt -of json /tmp/rf-video/reference.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 2 -i /tmp/rf-video/reference.mp4 -frames:v 1 -vf 'scale=1200:-2' /tmp/rf-video/reference-frame.jpg
      - name: Capture video evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-video-evidence
          path: /tmp/rf-video/reference-frame.jpg
          retention-days: 3
          if-no-files-found: warn
